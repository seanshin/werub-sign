# sign.example.org — 환자 포털 + 관리자 콘솔 + API (same-origin)
# 설치:
#   sudo cp deploy/nginx/sign.example.org.conf /etc/nginx/sites-available/sign.example.org
#   sudo ln -s /etc/nginx/sites-available/sign.example.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   # DNS A레코드(sign.example.org → 서버) 후:
#   sudo certbot --nginx -d sign.example.org   # TLS 자동 구성(443 + 80 리다이렉트)
#
# 기존 site(hospital-run/jitsi/twin) 미변경 — server_name 분리로 격리.

# 공통 프록시 라우팅 (80/443 공유) — sign-core(API)·sign-web(SPA) same-origin
# Cloudflare 프록시 뒤: 엣지가 *.example.org TLS 종단, 원본은 LE 인증서로 443 수신(Full).
map $http_upgrade $sign_conn { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name sign.example.org;
    client_max_body_size 20m;

    # Let's Encrypt ACME challenge (갱신용 — 80 유지)
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location /v1/    { proxy_pass http://127.0.0.1:4100; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /health { proxy_pass http://127.0.0.1:4100; proxy_set_header Host $host; }
    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sign_conn;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sign.example.org;
    client_max_body_size 20m;

    ssl_certificate     /etc/letsencrypt/live/sign.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sign.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ── H2: 관리자 콘솔(/admin) 내부망 IP 제한 — go-live 실서비스 시 적용(원내망 CIDR 확정 후) ──
    # ⚠️ Cloudflare 프록시 뒤에서는 $remote_addr 가 CF 엣지 IP → 단순 allow/deny 는 전원 차단됨.
    #    실 클라이언트 IP 복원이 선행되어야 함(아래 set_real_ip_from = CF 대역, real_ip_header).
    #    또는 Cloudflare Zero Trust/Access 로 /admin 보호(앱 앞단 차단)가 더 견고 — 택1.
    #
    # # (A) nginx IP allowlist (CF 실IP 복원 + 원내망 대역 교체):
    # set_real_ip_from 173.245.48.0/20;  # … Cloudflare 공식 IP 대역 전체 등록(cloudflare.com/ips)
    # real_ip_header CF-Connecting-IP;
    # location /admin {
    #     allow 10.0.0.0/8;   # ← 원내망/운영 CIDR 로 교체
    #     deny all;
    #     proxy_pass http://127.0.0.1:3050; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location /v1/    { proxy_pass http://127.0.0.1:4100; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /health { proxy_pass http://127.0.0.1:4100; proxy_set_header Host $host; }
    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sign_conn;
    }
}
